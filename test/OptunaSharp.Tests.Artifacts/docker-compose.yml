# Integration-test emulators for the OptunaSharp cloud artifact backends.
#
#   Bring up:   docker compose -f test/OptunaSharp.Tests.Artifacts/docker-compose.yml up -d
#   Run tests:  dotnet test test/OptunaSharp.Tests.Artifacts -c Release --filter TestCategory=Integration
#   Tear down:  docker compose -f test/OptunaSharp.Tests.Artifacts/docker-compose.yml down -v
#
# Every backend is exercised against a local, credential-free emulator — no cloud account needed:
#   - Adobe S3Mock     -> S3 (Boto3ArtifactStore) AND Cloudflare R2 (R2ArtifactStore; R2 speaks the S3 API)
#   - Azurite          -> Azure Blob (AzureBlobArtifactStore)   [Microsoft's official emulator]
#   - fake-gcs-server  -> Google Cloud Storage (GCSArtifactStore)
#
# The integration tests self-skip (Assert.Inconclusive) when an emulator's port is not reachable, so
# they are safe to run without Docker. Set OPTUNASHARP_ARTIFACT_EMULATORS_REQUIRED=1 to make an absent
# emulator a hard failure instead (for CI once wired).
services:
  # S3 API emulator. This used to be MinIO, but Docker Hub stopped serving `minio/minio` to anonymous
  # pulls ("pull access denied") and `quay.io/minio/minio` answers 401, so `up` failed for every service.
  # S3Mock accepts any credentials and path-style requests — all 7 S3 + R2 integration tests pass on it.
  # Pinned (not :latest) so a breaking S3Mock major cannot silently change the emulator under the tests.
  s3:
    image: adobe/s3mock:5.2.3
    ports:
      - "9000:9090"   # S3 API endpoint (S3Mock listens on 9090; the tests use localhost:9000)

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
    ports:
      - "10000:10000" # Blob service endpoint

  fake-gcs-server:
    image: fsouza/fake-gcs-server:latest
    command: -scheme http -host 0.0.0.0 -port 4443 -public-host localhost:4443
    ports:
      - "4443:4443"   # GCS JSON API endpoint
