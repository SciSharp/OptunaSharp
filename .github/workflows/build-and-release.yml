name: Build and Release

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions: write-all

env:
  # Suppress noisy XML-doc build warnings that clutter CI annotations. %3B is a URL-encoded
  # semicolon because the MSBuild CLI treats a raw ; as a property separator.
  DOTNET_NOWARN: CS1591%3BCS1573%3BCS1572%3BCS1570%3BCS1574%3BCS1587%3BCS1711%3BCS1734

jobs:
  # ---------------------------------------------------------------------------------------------
  # Build + unit tests across the three OSes. OptunaSharp.Core resolves NumSharp +
  # NumSharp.Interop.OpenBLAS from NuGet (nuget.org); the OpenBLAS package carries the native
  # LAPACK/CBLAS binaries in runtimes/<rid>/native, so there is no submodule init or native staging.
  # ---------------------------------------------------------------------------------------------
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x
        dotnet-quality: 'preview'

    - name: Build
      run: dotnet build test/OptunaSharp.Tests/OptunaSharp.Tests.csproj --configuration Release -p:NoWarn=${{ env.DOTNET_NOWARN }}

    # Filtering:
    #   - OpenBugs / HighMemory: excluded (known-failing / resource-heavy)
    #   - WindowsOnly: excluded on non-Windows runners
    #   - RequiresPython: excluded here — the live-Optuna suite is its own job below
    - name: Test (net8.0)
      shell: bash
      timeout-minutes: 10
      run: |
        FILTER="TestCategory!=OpenBugs&TestCategory!=HighMemory&TestCategory!=RequiresPython"
        if [[ "$RUNNER_OS" != "Windows" ]]; then
          FILTER="$FILTER&TestCategory!=WindowsOnly"
        fi
        dotnet test test/OptunaSharp.Tests/OptunaSharp.Tests.csproj \
          --configuration Release --no-build --framework net8.0 \
          --filter "$FILTER" --logger "trx"

    - name: Test (net10.0)
      shell: bash
      timeout-minutes: 10
      run: |
        FILTER="TestCategory!=OpenBugs&TestCategory!=HighMemory&TestCategory!=RequiresPython"
        if [[ "$RUNNER_OS" != "Windows" ]]; then
          FILTER="$FILTER&TestCategory!=WindowsOnly"
        fi
        dotnet test test/OptunaSharp.Tests/OptunaSharp.Tests.csproj \
          --configuration Release --no-build --framework net10.0 \
          --filter "$FILTER" --logger "trx"

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}
        path: ${{ github.workspace }}/**/TestResults/**/*.trx
        retention-days: 5

  # ---------------------------------------------------------------------------------------------
  # Strong-naming gate on EVERY push and PR. Packs a THROWAWAY OptunaSharp into a scratch directory
  # and asserts every shipped assembly carries the shared SciSharp key — a release-only gate is how
  # this class of defect (shipping PublicKeyToken=null) survives unnoticed. Publishes nothing.
  # ---------------------------------------------------------------------------------------------
  verify-signing:
    name: Verify strong naming
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x
        dotnet-quality: 'preview'

    # The key is committed and marked `binary` in .gitattributes (without which `* text=auto eol=lf`
    # would rewrite CRLF bytes inside it and corrupt the key). Assert both facts before building.
    - name: Key is present and intact
      run: |
        test -f Open.snk || { echo "::error::Open.snk missing from checkout — signing cannot work."; exit 1; }
        SIZE=$(stat -c%s Open.snk)
        SHA=$(sha256sum Open.snk | cut -d' ' -f1)
        echo "Open.snk: $SIZE bytes, sha256 $SHA"
        [ "$SIZE" = "596" ] || { echo "::error::Open.snk is $SIZE bytes, expected 596 — likely line-ending corruption; check the '*.snk binary' rule in .gitattributes."; exit 1; }
        [ "$SHA" = "b897629e0b20090c9219ac80392c037fa4cfcc2bdc21d3c45d9bf74b8df0f671" ] || { echo "::error::Open.snk content changed."; exit 1; }

    - name: Pack (throwaway) and verify the shipped assembly is signed
      run: |
        mkdir -p artifacts/signing-check
        # GeneratePackageOnBuild is not set on OptunaSharp.Core, so a plain `dotnet pack` uses the
        # normal restore -> build -> pack ordering.
        dotnet pack src/OptunaSharp.Core/OptunaSharp.Core.csproj --configuration Release \
          --output artifacts/signing-check \
          -p:NoWarn=${{ env.DOTNET_NOWARN }}
        dotnet run .github/scripts/verify_strong_name.cs -- artifacts/signing-check

  # ---------------------------------------------------------------------------------------------
  # Python.NET interop against LIVE Optuna. Its own job so the embedded-CPython setup cannot slow
  # down or destabilise the main gate, and a red here is immediately attributable to interop.
  # Building is itself a gate — this is the only place CI compiles OptunaSharp.Tests.Interop.
  # ---------------------------------------------------------------------------------------------
  interop-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]

    runs-on: ${{ matrix.os }}

    # This job installs Python + Optuna below, so the engine MUST start here. Requiring it turns a
    # discovery break red instead of green-by-skipping.
    env:
      OPTUNASHARP_PYTHONNET_REQUIRE_ENGINE: '1'

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x
        dotnet-quality: 'preview'

    # 3.12 sits inside pythonnet 3.0.5's supported range (3.7-3.13) and has Optuna wheels everywhere.
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install vendored Optuna (5.0.0.dev) + live-oracle deps
      shell: bash
      run: |
        # The C# port is validated against the VENDORED optuna (src/optuna submodule, 5.0.0.dev), NOT
        # PyPI optuna — a version mismatch makes the differential oracle assert against the wrong impl.
        git submodule update --init src/optuna
        python -m pip install --upgrade pip
        # Pin numpy to 2.4.2: its wheel bundles the exact scipy-openblas the NumSharp OpenBLAS natives
        # mirror, so BLAS-backed oracles (np.linalg / CMA-ES eigh) stay byte-identical to C#.
        python -m pip install "numpy==2.4.2"
        python -m pip install -e src/optuna
        # Backends the parity tests drive LIVE: torch (GPSampler), cmaes (CmaEsSampler), scikit-learn
        # (fANOVA / importance), matplotlib (visualization). CPU-only torch on Linux keeps the download
        # small. scikit-learn is PINNED to 1.8.0: the native fANOVA/MDI forests are a byte-for-byte port
        # of that release's RandomForestRegressor, so a newer sklearn (1.9.0) builds slightly different
        # trees and breaks the 1e-12 value parity. redis-py is deliberately NOT installed here so the
        # JournalRedis interop test self-skips (no server in this job; Redis is covered by the
        # docker-compose Storage suite instead).
        if [ "$RUNNER_OS" = "Linux" ]; then
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
        else
          python -m pip install torch
        fi
        python -m pip install cmaes "scikit-learn==1.8.0" matplotlib
        # BoTorch parity gate (OptunaSharp.Interop.BoTorch → BoTorchApiParityTests / BoTorchSamplerParityTests):
        # install botorch (pulls gpytorch/linear_operator, reuses the CPU torch above) + the VENDORED
        # optuna_integration (refs/optuna-integration, matching the ported botorch.py) so the bridge is
        # compared against the exact optuna_integration source it ports. Linux-only: byte-parity is the SAME
        # botorch driven on both sides and is CPU-deterministic / OS-independent, so one OS gates it — macOS
        # (10x runner minutes) and Windows self-skip (RequireBoTorchOrInconclusive → Inconclusive). --no-deps
        # keeps the vendored optuna (src/optuna, 5.0.0.dev) from being replaced by a PyPI optuna.
        if [ "$RUNNER_OS" = "Linux" ]; then
          git submodule update --init refs/optuna-integration
          python -m pip install botorch
          python -m pip install -e refs/optuna-integration --no-deps
        fi
        # find_libpython locates the loadable libpython across framework/venv/manylinux builds — the
        # macOS framework build's INSTSONAME is a framework path that a naive LIBDIR join misses.
        python -m pip install find_libpython
        # pymoo 0.6.1.3 — Mimicry's pin and the exact oracle the native AgeMoea2Optimizer reproduces
        # generation-by-generation (OptunaSharp.Interop.Pymoo → AgeMoea2ParityTests + PymooSamplerParityTests /
        # PymooApiUnitTests). --no-deps keeps pymoo from dragging its own numpy/scipy; its AGE-MOEA-2 survival
        # kernels JIT through numba (llvmlite comes with it), and autograd/alive_progress are import-time deps
        # (scipy/matplotlib are already installed above). The "Re-pin numpy last" below keeps numpy on 2.4.2 so
        # the byte-exact BLAS oracles stay identical; numba 0.65+ supports numpy 2.4.2. AGE-MOEA-2 parity is
        # host-pinned to x64 (AgeMoea2ParityTests self-skips on the macOS arm64 runner, like CMA-ES/linalg).
        python -m pip install pymoo==0.6.1.3 --no-deps
        python -m pip install autograd alive_progress numba
        # Re-pin numpy last: torch/optuna/numba resolution can drag in a different numpy.
        python -m pip install "numpy==2.4.2"
        python -c "import numpy, optuna; print('optuna', optuna.__version__, '| numpy', numpy.__version__)"
        python -c "import numpy; assert numpy.__version__ == '2.4.2', 'numpy must be 2.4.2 for byte-exact BLAS parity'"
        python -c "from pymoo.algorithms.moo.age2 import AGEMOEA2; import pymoo, numba; print('pymoo', pymoo.__version__, '| numba', numba.__version__)"

    # Compute the libpython path and export it so pythonnet binds deterministically (PythonSession
    # honors PYTHONNET_PYDLL before its own probe). Works on all three OSes via the runner's python.
    # ML.NET's LightGBM native (lib_lightgbm) needs the OpenMP runtime, which macOS lacks by default;
    # brew provides it so the LightGbm ranking parity tests can load their backend. Where ML.NET ships
    # no osx-arm64 native at all, those tests self-skip (Inconclusive) rather than fail.
    - name: Install libomp for ML.NET LightGBM (macOS)
      if: runner.os == 'macOS'
      run: brew install libomp || true

    - name: Resolve libpython (PYTHONNET_PYDLL)
      shell: bash
      run: |
        PYDLL=$(python - <<'PY'
        import os, sys, sysconfig, glob
        # Primary: find_libpython (maintained, handles every build layout incl. the macOS framework).
        try:
            from find_libpython import find_libpython
            p = find_libpython() or ''
        except Exception:
            p = ''
        # Fallback: an existence-checked candidate list (never a blind LIBDIR+INSTSONAME join, which is
        # what returned a non-existent path on the macOS runner and made pythonnet fail to load).
        if not p or not os.path.isfile(p):
            v = '%d.%d' % sys.version_info[:2]
            libdir = sysconfig.get_config_var('LIBDIR') or ''
            if os.name == 'nt':
                cands = [os.path.join(sys.base_prefix, 'python%d%d.dll' % sys.version_info[:2])]
            else:
                ext = 'dylib' if sys.platform == 'darwin' else 'so'
                cands = [
                    os.path.join(libdir, 'libpython%s.%s' % (v, ext)),
                    os.path.join(libdir, sysconfig.get_config_var('LDLIBRARY') or ''),
                    os.path.join(libdir, sysconfig.get_config_var('INSTSONAME') or ''),
                    os.path.join(sys.base_prefix, 'lib', 'libpython%s.%s' % (v, ext)),
                ] + glob.glob(os.path.join(libdir, 'libpython%s*.%s' % (v, ext)))
            p = next((c for c in cands if c and os.path.isfile(c)), '')
        print(p)
        PY
        )
        if [ -z "$PYDLL" ] || [ ! -f "$PYDLL" ]; then
          echo "::error::could not resolve a loadable libpython (got '$PYDLL')"; exit 1
        fi
        echo "PYTHONNET_PYDLL=$PYDLL" >> "$GITHUB_ENV"
        echo "PYTHONNET_PYDLL resolved to: $PYDLL"

    - name: Build
      run: dotnet build test/OptunaSharp.Tests.Interop/OptunaSharp.Tests.Interop.csproj --configuration Release -p:NoWarn=${{ env.DOTNET_NOWARN }}

    - name: Test (net8.0)
      timeout-minutes: 10
      shell: bash
      run: |
        dotnet test test/OptunaSharp.Tests.Interop/OptunaSharp.Tests.Interop.csproj \
          --configuration Release --no-build --framework net8.0 --logger "trx"

    - name: Test (net10.0)
      timeout-minutes: 10
      shell: bash
      run: |
        dotnet test test/OptunaSharp.Tests.Interop/OptunaSharp.Tests.Interop.csproj \
          --configuration Release --no-build --framework net10.0 --logger "trx"

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: interop-test-results-${{ matrix.os }}
        path: ${{ github.workspace }}/**/TestResults/**/*.trx
        retention-days: 5

  # ---------------------------------------------------------------------------------------------
  # Release pipeline — only on a v* tag pushed from master.
  # ---------------------------------------------------------------------------------------------
  validate-release:
    needs: [test, interop-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      is_valid: ${{ steps.check.outputs.is_valid }}
      version: ${{ steps.check.outputs.version }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Verify tag is on master branch
      id: check
      run: |
        TAG_COMMIT=$(git rev-parse HEAD)
        VERSION="${GITHUB_REF#refs/tags/v}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        if git merge-base --is-ancestor "$TAG_COMMIT" origin/master; then
          echo "Tag v$VERSION is on master branch"
          echo "is_valid=true" >> $GITHUB_OUTPUT
        else
          echo "::error::Tag v$VERSION is NOT on master branch. Releases must be tagged from master."
          echo "is_valid=false" >> $GITHUB_OUTPUT
          exit 1
        fi

  build-nuget:
    needs: validate-release
    if: needs.validate-release.outputs.is_valid == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x
        dotnet-quality: 'preview'

    - name: Get version info
      id: version
      shell: bash
      run: |
        VERSION="${GITHUB_REF#refs/tags/v}"
        ASSEMBLY_VERSION="${VERSION%%-*}"
        COMMIT_SHA="${GITHUB_SHA:0:7}"
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "ASSEMBLY_VERSION=$ASSEMBLY_VERSION" >> $GITHUB_OUTPUT
        echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_OUTPUT
        echo "Building version $VERSION (assembly: $ASSEMBLY_VERSION) +$COMMIT_SHA"

    - name: Build
      run: |
        # -t:Rebuild (NOT incremental): the shipping project emits XML docs (GenerateDocumentationFile)
        # and the Pack step runs --no-build. An incremental build can declare a stale TFM up-to-date and
        # skip CoreCompile, leaving no .xml on disk — pack then fails NU5026 or packs stale output.
        dotnet build src/OptunaSharp.Core/OptunaSharp.Core.csproj \
          --configuration Release -t:Rebuild \
          -p:NoWarn=${{ env.DOTNET_NOWARN }} \
          -p:Version=${{ steps.version.outputs.VERSION }} \
          -p:AssemblyVersion=${{ steps.version.outputs.ASSEMBLY_VERSION }} \
          -p:FileVersion=${{ steps.version.outputs.ASSEMBLY_VERSION }} \
          -p:PackageVersion=${{ steps.version.outputs.VERSION }} \
          -p:SourceRevisionId=${{ steps.version.outputs.COMMIT_SHA }}

    - name: Pack
      run: |
        mkdir -p artifacts/nuget
        dotnet pack src/OptunaSharp.Core/OptunaSharp.Core.csproj \
          --configuration Release --no-build --output artifacts/nuget \
          -p:NoWarn=${{ env.DOTNET_NOWARN }} \
          -p:Version=${{ steps.version.outputs.VERSION }} \
          -p:AssemblyVersion=${{ steps.version.outputs.ASSEMBLY_VERSION }} \
          -p:FileVersion=${{ steps.version.outputs.ASSEMBLY_VERSION }} \
          -p:PackageVersion=${{ steps.version.outputs.VERSION }}
        echo "Packages built:"
        ls -la artifacts/nuget/

    # Last gate before the artifact leaves the machine: every managed assembly in the .nupkg must
    # carry OptunaSharp's public key AND a real signature (not delay-signed).
    - name: Verify strong naming of packed assemblies
      run: dotnet run .github/scripts/verify_strong_name.cs -- artifacts/nuget

    - name: Upload NuGet Packages
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: artifacts/nuget/*.nupkg
        retention-days: 5

  create-release:
    needs: [validate-release, build-nuget]
    if: needs.validate-release.outputs.is_valid == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Extract version
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Download NuGet Packages
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
        path: artifacts

    - name: Generate checksums
      run: |
        cd artifacts
        for f in *.nupkg; do
          sha256sum "$f" | cut -d' ' -f1 > "${f}.sha256"
          echo "${f}: $(cat ${f}.sha256)"
        done

    - name: Check if prerelease
      id: prerelease
      run: |
        if [[ "${{ steps.version.outputs.VERSION }}" == *"-"* ]]; then
          echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
        else
          echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
        fi

    - name: Compose release notes
      id: notes
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        {
          echo "## OptunaSharp v${VERSION}"
          echo ""
          echo "### Install via NuGet"
          echo ""
          echo '```'
          echo "dotnet add package OptunaSharp --version ${VERSION}"
          echo '```'
          echo ""
          echo "| Package | NuGet |"
          echo "|---------|-------|"
          echo "| OptunaSharp | [![NuGet](https://img.shields.io/nuget/v/OptunaSharp.svg)](https://www.nuget.org/packages/OptunaSharp/${VERSION}) |"
        } > RELEASE_BODY.md

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/*.nupkg
          artifacts/*.sha256
        draft: false
        prerelease: ${{ steps.prerelease.outputs.IS_PRERELEASE }}
        generate_release_notes: true
        body_path: RELEASE_BODY.md

  publish-nuget:
    needs: [validate-release, build-nuget]
    if: needs.validate-release.outputs.is_valid == 'true'
    runs-on: ubuntu-latest

    steps:
    - name: Download NuGet Packages
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
        path: artifacts

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # Soft-skip when NUGETAPIKEY is not configured: the rest of the release pipeline (validate → pack →
    # strong-name gate → GitHub Release) still runs and is asserted, but the irreversible nuget.org push
    # only happens once a key is set. So a v* tag on a mirror without the secret goes green (publish
    # skipped with a warning) instead of hard-failing on an empty --api-key.
    - name: Push to NuGet
      env:
        NUGET_KEY: ${{ secrets.NUGETAPIKEY }}
      run: |
        if [ -z "$NUGET_KEY" ]; then
          echo "::warning::NUGETAPIKEY is not configured — skipping the nuget.org publish (soft skip). Set the repo secret to enable publishing."
          exit 0
        fi
        for package in artifacts/*.nupkg; do
          echo "Pushing $package..."
          dotnet nuget push "$package" \
            --api-key "$NUGET_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        done
