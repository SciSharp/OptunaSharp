name: Build and Release

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]
  # A manual run reproduces a v* tag's test matrix (all 3 OSes, both TFMs) without the release jobs,
  # which only a tag triggers. `run_slow` controls the Slow category. It defaults to on, as on a tag;
  # off gives a ~2 h shorter rehearsal, e.g. to re-check one OS leg. A tag always runs Slow.
  workflow_dispatch:
    inputs:
      run_slow:
        description: Also run the Slow test category (unit claim runs ~6 min; BoTorch interop parity ~80+ min)
        type: boolean
        default: true

# Least privilege. Every job only reads the repository, except `create-release`, which declares the
# one write it needs (contents: write, to create the GitHub Release). This replaced `write-all`, which
# handed a write token to every test job, including those that run pull-request code.
permissions:
  contents: read

# Cancel an in-flight run when a newer commit lands on the SAME ref (branch or PR). Pushing three
# commits to a PR used to launch three full 6-job matrices that all ran to completion; now only the
# newest survives. Tags are exempt (cancel-in-progress=false) so a release build is never aborted
# mid-flight by another tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Suppress noisy XML-doc build warnings that clutter CI annotations. %3B is a URL-encoded
  # semicolon because the MSBuild CLI treats a raw ; as a property separator.
  DOTNET_NOWARN: CS1591%3BCS1573%3BCS1572%3BCS1570%3BCS1574%3BCS1587%3BCS1711%3BCS1734
  # No telemetry upload and no first-run banner in CI logs.
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

# RUNNER IMAGES ARE PINNED (ubuntu-24.04, windows-2025, macos-26), never `-latest`. The bit-exact parity
# suites depend on the image: its libm, glibc and CPU dispatch decide the last bits of exp/log/pow. A
# `-latest` label migrates to a new OS on GitHub's schedule (ubuntu-latest began moving to Ubuntu 26.04
# on 2026-10-19), and that would change those bits without any commit. To move to a newer image, bump the
# labels in `setup` and in every `runs-on` below together, then re-verify a full dispatch run.
#
# SDK. actions/setup-dotnet installs the newest GA 8.0.x and 10.0.x. The 10.0 SDK builds everything, the
# 8.0 runtime runs the net8.0 tests, and global.json keeps `dotnet` on the 10.0 GA line. Workflows used
# to pass `dotnet-quality: 'preview'`, which installed the 8.0.100-rc.2 and 10.0.100-rc.2 SDKs, about
# 450 MB per job that the build then never used.

jobs:
  # ---------------------------------------------------------------------------------------------
  # Decide how wide to fan the matrix, per trigger — the single biggest lever on Actions minutes.
  # Emitted as job outputs the `test` / `satellite-tests` / `interop-test` matrices consume:
  #   oses        JSON array of runner OSes
  #   tfms_space  space-separated TFM list, for the `for TFM in ...` test loop
  #   interop     JSON array of {os, part} legs for `interop-test`: a "main" leg per OS, plus an ubuntu
  #               "slow" leg (the Slow BoTorch parity) whenever Slow runs. The slow leg used to be a step
  #               at the end of ubuntu's main leg, which made that leg the run's critical path: 24 min
  #               (7.3 min of interop tests, then 13.1 min of Slow) against 15-17 for every other leg
  #               (dispatch 42399672195). As its own leg it runs beside them, for one more ~3.5 min setup.
  #
  # Policy (why each tier):
  #   * v* tag / manual dispatch -> all 3 OSes + both TFMs. Release confidence and the only place the
  #                                 macOS-specific paths (framework libpython resolution, brew libomp)
  #                                 are exercised.
  #   * push to main / master    -> x64 OSes (ubuntu + windows) + both TFMs. macOS on GitHub is arm64
  #                                 and SELF-SKIPS ~60% of the byte-exact parity suite (CMA-ES / linalg /
  #                                 AGE-MOEA-2 are x64-pinned), so its 10x-billed minutes buy almost no
  #                                 unique coverage — it is covered on tags/dispatch instead.
  #   * pull_request             -> x64 OSes + the modern TFM only (net10.0). net8.0 is a
  #                                 compatibility leg re-checked on the post-merge push.
  # ---------------------------------------------------------------------------------------------
  setup:
    name: Decide CI scope
    runs-on: ubuntu-24.04
    outputs:
      oses: ${{ steps.scope.outputs.oses }}
      tfms_space: ${{ steps.scope.outputs.tfms_space }}
      interop: ${{ steps.scope.outputs.interop }}
    steps:
      - id: scope
        shell: bash
        env:
          # Whether the Slow category runs: on every v* tag, and on a manual dispatch unless `run_slow` is off.
          # `inputs` is empty on other events, so this is `false` there.
          RUN_SLOW: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.run_slow) }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            OSES='["ubuntu-24.04","windows-2025","macos-26"]'
            TFMS='net8.0 net10.0'
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            OSES='["ubuntu-24.04","windows-2025"]'
            TFMS='net8.0 net10.0'
          else
            OSES='["ubuntu-24.04","windows-2025"]'
            TFMS='net10.0'
          fi
          echo "oses=$OSES"       >> "$GITHUB_OUTPUT"
          echo "tfms_space=$TFMS" >> "$GITHUB_OUTPUT"
          # One "main" interop leg per OS, then the ubuntu "slow" leg when Slow runs (botorch is Linux-only).
          INTEROP=$(jq -c --argjson slow "$RUN_SLOW" \
            '[.[] | {os: ., part: "main"}] + (if $slow then [{os: "ubuntu-24.04", part: "slow"}] else [] end)' <<< "$OSES")
          echo "interop=$INTEROP" >> "$GITHUB_OUTPUT"
          echo "Resolved CI scope:"; cat "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------------------------
  # Build + unit tests across the selected OSes. OptunaSharp.Core resolves NumSharp +
  # NumSharp.Interop.OpenBLAS from NuGet (nuget.org); the OpenBLAS package carries the native
  # LAPACK/CBLAS binaries in runtimes/<rid>/native, so there is no submodule init or native staging.
  # ---------------------------------------------------------------------------------------------
  test:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.oses) }}

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    # Cache the global NuGet package folder so NumSharp/OpenBLAS/MSTest/etc. are not re-downloaded
    # every run. Key on the project/props files (no lock files in this repo) so it invalidates when a
    # dependency version changes; the OS-scoped restore-key still gives a warm partial cache otherwise.
    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    # Build the project as declared (both TFMs). The Test step then runs only the TFM(s) this trigger
    # selected (net10.0 on PRs, both on push/tag). A per-run TargetFrameworks override was tried, but a
    # multi-value global property breaks the SDK's multi-targeting dispatch (NETSDK1046), so we build both
    # and simply skip the extra TFM at test time — the wasted PR build is small next to the macOS/cache wins.
    - name: Build
      run: dotnet build test/OptunaSharp.Tests/OptunaSharp.Tests.csproj --configuration Release -p:NoWarn=${{ env.DOTNET_NOWARN }}

    # Filtering:
    #   - OpenBugs / HighMemory: excluded (known-failing / resource-heavy)
    #   - WindowsOnly: excluded on non-Windows runners
    #   - RequiresPython: excluded here — the live-Optuna suite is its own job below
    #   - Slow: excluded here — the ~10 s+ paper-claim runs (REMBO/SAASBO) are 12 tests but ~80% of the
    #     suite's wall time; they run in the "Test (slow)" step below on ubuntu for tags/dispatch.
    # Both TFMs (push/tag) or just net10.0 (PR) run from the single build above, --no-build.
    - name: Test
      shell: bash
      timeout-minutes: 15
      run: |
        # Pin OpenBLAS to its Haswell kernels on x64: DYNAMIC_ARCH otherwise picks the kernel per runner CPU
        # (SkylakeX/Zen on AVX-512 hosts), whose last bits differ from the committed linalg oracles (generated
        # on Haswell kernels — AgeMoea2OperatorParityTests' Normalize/Do failed by 1-2 ULP on such a runner)
        # and could differ between NumPy's and NumSharp's OpenBLAS copies. Every x64 runner has AVX2/FMA.
        # Except Windows on AMD CPUs with AVX-512 (Zen 4/5), where OpenBLAS 0.3.34's forced Haswell kernels fault: the script
        # decides per runner and says which it chose, and why.
        source "$GITHUB_WORKSPACE/.github/scripts/openblas_coretype.sh"
        FILTER="TestCategory!=OpenBugs&TestCategory!=HighMemory&TestCategory!=RequiresPython&TestCategory!=Slow"
        if [[ "$RUNNER_OS" != "Windows" ]]; then
          FILTER="$FILTER&TestCategory!=WindowsOnly"
        fi
        # Windows only: a test-host crash leaves the blame sequence (the tests that ran, the last one unfinished)
        # and, when the runtime sees the crash, a mini dump under TestResults, which the upload below keeps. It
        # earned its place on 2026-11-14: PR #6's test hosts died with nothing logged, and the sequence named
        # JanusDeSamplerTests.Sampler_ScalarMode_Runs, which led to OpenBLAS 0.3.34's forced Haswell kernels
        # faulting on AMD Zen 4/5 (see .github/scripts/openblas_coretype.sh; that access violation left no dump).
        # Linux and macOS keep the plain run: the flag was only tried on Windows.
        BLAME=()
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          BLAME=(--blame-crash --blame-crash-dump-type mini)
        fi
        for TFM in ${{ needs.setup.outputs.tfms_space }}; do
          echo "::group::Unit tests ($TFM)"
          dotnet test test/OptunaSharp.Tests/OptunaSharp.Tests.csproj \
            --configuration Release --no-build --framework "$TFM" \
            --filter "$FILTER" --logger "trx" "${BLAME[@]}"
          echo "::endgroup::"
        done

    # The Slow category (see TestCategory.Slow): deterministic, but ~7 min per TFM locally — release-confidence
    # coverage, so ubuntu only (1x minutes) and only for v* tags and manual dispatch, both TFMs. Every full
    # local `dotnet test` run includes them.
    - name: Test (slow)
      if: runner.os == 'Linux' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.run_slow))
      shell: bash
      timeout-minutes: 60
      run: |
        # Pin OpenBLAS to its Haswell kernels on x64: DYNAMIC_ARCH otherwise picks the kernel per runner CPU
        # (SkylakeX/Zen on AVX-512 hosts), whose last bits differ from the committed linalg oracles (generated
        # on Haswell kernels — AgeMoea2OperatorParityTests' Normalize/Do failed by 1-2 ULP on such a runner)
        # and could differ between NumPy's and NumSharp's OpenBLAS copies. Every x64 runner has AVX2/FMA.
        # Except Windows on AMD CPUs with AVX-512 (Zen 4/5), where OpenBLAS 0.3.34's forced Haswell kernels fault: the script
        # decides per runner and says which it chose, and why.
        source "$GITHUB_WORKSPACE/.github/scripts/openblas_coretype.sh"
        for TFM in ${{ needs.setup.outputs.tfms_space }}; do
          echo "::group::Slow unit tests ($TFM)"
          dotnet test test/OptunaSharp.Tests/OptunaSharp.Tests.csproj \
            --configuration Release --no-build --framework "$TFM" \
            --filter "TestCategory=Slow&TestCategory!=OpenBugs&TestCategory!=HighMemory" --logger "trx"
          echo "::endgroup::"
        done

    # The TRX files, plus what --blame-crash leaves after a Windows test-host crash (the dump and the sequence of
    # tests): a pattern with no match is skipped, so a clean run uploads the TRX files only.
    - name: Upload Test Results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results-${{ matrix.os }}
        path: |
          ${{ github.workspace }}/**/TestResults/**/*.trx
          ${{ github.workspace }}/**/TestResults/**/*.dmp
          ${{ github.workspace }}/**/TestResults/**/Sequence_*.xml
        retention-days: 5

  # ---------------------------------------------------------------------------------------------
  # The satellite test suites: every test/OptunaSharp.Tests.*/ project except the two that have jobs of
  # their own (Interop below; PackageParity in package-parity.yml). That covers Storage, Artifacts, Cli,
  # Hosting, Importance.Booster, Importance.Forests, Integration.LightGbm, Integration.ML.NET and
  # Benchmark.VolleyEval: about 600 tests over the satellite packages the release ships, which no
  # workflow ran before. Interop.ChildProcess is skipped too: it holds no tests, it is the console app the
  # interop suite runs in a process of its own (catalog Open item 28), and that suite's build builds it.
  #
  # Services (Linux only: Windows and macOS runners cannot run Linux containers):
  #   - Redis (Storage journal backends), from test/OptunaSharp.Tests.Storage/docker-compose.yml;
  #   - S3Mock / Azurite / fake-gcs-server (artifact stores), from test/OptunaSharp.Tests.Artifacts;
  #   - PostgreSQL and MySQL (EF Core storage): Testcontainers starts them itself.
  # On Linux the *_REQUIRED switches turn a missing service into a failure instead of a green self-skip.
  # Elsewhere the service-backed cases report Inconclusive and the rest of each suite still runs.
  #
  # Python: the vendored Optuna is installed so OptunaSharp.Tests.Cli's parity cases compare against the
  # real `optuna` CLI. refs/optuna also carries the upgrade-test databases the Storage and Cli suites read.
  #
  # OSes: the two x64 runners on every trigger, never macOS. The macOS runner is arm64. ML.NET's LightGBM
  # package ships no osx-arm64 native library, so Integration.LightGbm cannot load there. The runner also
  # cannot host the Linux service containers, so the leg would fail or self-skip on platform gaps rather
  # than test OptunaSharp.
  # ---------------------------------------------------------------------------------------------
  satellite-tests:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-2025 ]

    runs-on: ${{ matrix.os }}

    env:
      OPTUNASHARP_REDIS_REQUIRED: ${{ startsWith(matrix.os, 'ubuntu') && '1' || '' }}
      OPTUNASHARP_EFCORE_REQUIRED: ${{ startsWith(matrix.os, 'ubuntu') && '1' || '' }}
      OPTUNASHARP_ARTIFACT_EMULATORS_REQUIRED: ${{ startsWith(matrix.os, 'ubuntu') && '1' || '' }}
      PIP_CACHE_DIR: ${{ github.workspace }}/.pip-cache

    steps:
    - uses: actions/checkout@v7

    # Own key prefix: this job restores the satellite packages' third-party graph (AWS, Azure, Google,
    # ML.NET, EF Core, gRPC, ...), which the unit-test job's cache entry does not hold.
    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-satellites-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
        restore-keys: nuget-satellites-${{ runner.os }}-

    - name: Cache pip downloads
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.pip-cache
        key: pip-satellites-${{ runner.os }}-${{ hashFiles('.github/workflows/build-and-release.yml') }}
        restore-keys: pip-satellites-${{ runner.os }}-

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    # The same vendored Optuna (v5.0.0) the interop job pins, so the CLI parity cases compare against
    # the exact release the port tracks. numpy 2.5.4 matches the interop job (NumSharp 0.81.0's reference NumPy).
    - name: Install vendored Optuna (CLI parity + upgrade-test assets)
      shell: bash
      run: |
        git submodule update --init refs/optuna
        python -m pip install --upgrade pip
        python -m pip install "numpy==2.5.4"
        python -m pip install -e refs/optuna
        optuna --version

    - name: Start the backing services (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        docker compose -p optunasharp-redis -f test/OptunaSharp.Tests.Storage/docker-compose.yml up -d --wait
        docker compose -p optunasharp-artifacts -f test/OptunaSharp.Tests.Artifacts/docker-compose.yml up -d
        # The emulators declare no healthcheck, so `up` returns as soon as the containers start. Wait
        # for each port to accept connections: with *_REQUIRED set, a slow start would otherwise fail
        # the first test instead of skipping it.
        for port in 9000 10000 4443; do
          for _ in $(seq 1 60); do
            if (exec 3<>"/dev/tcp/127.0.0.1/$port") 2>/dev/null; then echo "port $port is up"; continue 2; fi
            sleep 1
          done
          echo "::error::artifact emulator on port $port did not come up"; docker compose -p optunasharp-artifacts -f test/OptunaSharp.Tests.Artifacts/docker-compose.yml logs; exit 1
        done

    # One `dotnet build` per suite: the src projects they share are compiled by the first and found up to
    # date by the rest.
    - name: Build the satellite suites
      shell: bash
      run: |
        set -euo pipefail
        for proj in test/OptunaSharp.Tests.*/*.csproj; do
          case "$proj" in */OptunaSharp.Tests.Interop/*|*/OptunaSharp.Tests.Interop.ChildProcess/*|*/OptunaSharp.Tests.PackageParity/*) continue ;; esac
          echo "::group::build $proj"
          dotnet build "$proj" --configuration Release -p:NoWarn=${{ env.DOTNET_NOWARN }}
          echo "::endgroup::"
        done

    # Same category policy as the unit-test job. Every suite runs even after one fails, so a single red
    # suite cannot hide the state of the others; the step fails at the end and names each red suite.
    - name: Test the satellite suites
      shell: bash
      timeout-minutes: 45
      run: |
        set -uo pipefail
        # OpenBLAS's Haswell pin on x64, except Windows on AMD CPUs with AVX-512 (the script explains both halves).
        source "$GITHUB_WORKSPACE/.github/scripts/openblas_coretype.sh"
        FILTER="TestCategory!=OpenBugs&TestCategory!=HighMemory&TestCategory!=Slow"
        if [[ "$RUNNER_OS" != "Windows" ]]; then FILTER="$FILTER&TestCategory!=WindowsOnly"; fi
        failed=()
        for proj in test/OptunaSharp.Tests.*/*.csproj; do
          case "$proj" in */OptunaSharp.Tests.Interop/*|*/OptunaSharp.Tests.Interop.ChildProcess/*|*/OptunaSharp.Tests.PackageParity/*) continue ;; esac
          for TFM in ${{ needs.setup.outputs.tfms_space }}; do
            echo "::group::$proj ($TFM)"
            if ! dotnet test "$proj" --configuration Release --no-build --framework "$TFM" \
                   --filter "$FILTER" --logger "trx"; then
              failed+=("$proj ($TFM)")
            fi
            echo "::endgroup::"
          done
        done
        if (( ${#failed[@]} > 0 )); then
          printf '::error::satellite suite failed: %s\n' "${failed[@]}"
          exit 1
        fi

    - name: Stop the backing services (Linux)
      if: always() && runner.os == 'Linux'
      shell: bash
      run: |
        docker compose -p optunasharp-redis -f test/OptunaSharp.Tests.Storage/docker-compose.yml down -v || true
        docker compose -p optunasharp-artifacts -f test/OptunaSharp.Tests.Artifacts/docker-compose.yml down -v || true

    - name: Upload Test Results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: satellite-test-results-${{ matrix.os }}
        path: ${{ github.workspace }}/**/TestResults/**/*.trx
        retention-days: 5

  # ---------------------------------------------------------------------------------------------
  # Python.NET interop against LIVE Optuna. Its own job so the embedded-CPython setup cannot slow
  # down or destabilise the main gate, and a red here is immediately attributable to interop.
  # Building is itself a gate — this is the only place CI compiles OptunaSharp.Tests.Interop.
  # ---------------------------------------------------------------------------------------------
  interop-test:
    needs: setup
    # The main legs keep the `interop-test (<os>)` name they have always had, so required checks and history stay
    # keyed the same; the Slow BoTorch leg is `interop-test (ubuntu-24.04, slow)`.
    name: ${{ matrix.part == 'slow' && format('interop-test ({0}, slow)', matrix.os) || format('interop-test ({0})', matrix.os) }}
    strategy:
      fail-fast: false
      matrix:
        # {os, part} legs from `setup`: "main" runs the live suite on each OS, "slow" the Slow category on ubuntu.
        include: ${{ fromJSON(needs.setup.outputs.interop) }}

    runs-on: ${{ matrix.os }}

    # This job installs Python + Optuna below, so the engine MUST start here. Requiring it turns a
    # discovery break red instead of green-by-skipping.
    env:
      OPTUNASHARP_PYTHONNET_REQUIRE_ENGINE: '1'
      # Fixed, OS-agnostic pip download cache so the heavy wheels (torch, numpy, scipy, sklearn, …)
      # are fetched once and reused across runs. Cached by the step below.
      PIP_CACHE_DIR: ${{ github.workspace }}/.pip-cache
      # 16 MB default stacks (hex, as every DOTNET_ setting) for threads .NET creates without a size, which includes the
      # test platform's worker thread. On macOS arm64 numba JIT-compiling pymoo's AGE-MOEA kernels overflowed the default
      # stack and killed the test host ("Stack overflow." in PymooSampler -> Algorithm.tell; dispatch 42268066671 and its
      # re-run). Diagnostic runs 42281082036 / 42288792150: default stacks crash, 16 MB and 64 MB pass all 11 pymoo rows.
      # Windows x64 passes even at 256 KB. Users need the same on macOS (src/OptunaSharp.Interop.Pymoo/README.md).
      DOTNET_DefaultStackSize: '1000000'

    steps:
    - uses: actions/checkout@v7

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
        restore-keys: nuget-${{ runner.os }}-

    # Cache pip's wheel downloads (torch alone is ~127 MB; the full stack was re-downloaded every run).
    # Keyed on this workflow file because the pip install list lives here, not in a requirements file.
    - name: Cache pip downloads
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.pip-cache
        key: pip-${{ runner.os }}-${{ hashFiles('.github/workflows/build-and-release.yml') }}
        restore-keys: pip-${{ runner.os }}-

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    # 3.12 sits inside pythonnet 3.2.1's supported range (3.11-3.15) and has Optuna wheels everywhere.
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install vendored Optuna (v5.0.0) + live-oracle deps
      shell: bash
      run: |
        # The C# port is validated against the VENDORED optuna (refs/optuna submodule, v5.0.0), NOT
        # PyPI optuna — a version mismatch makes the differential oracle assert against the wrong impl.
        git submodule update --init refs/optuna
        python -m pip install --upgrade pip
        # Pin numpy to 2.5.4: its wheel bundles the exact scipy-openblas (0.3.34.106.0) that NumSharp 0.81.0's
        # OpenBLAS natives mirror, so BLAS-backed oracles (np.linalg / CMA-ES eigh / UNDX dot products) stay
        # byte-identical to C#. Move this pin with $(NumSharpVersion): each NumSharp release bundles the OpenBLAS
        # of its reference NumPy (0.80.0 carried numpy 2.4.2's; the step to 0.81.0 moved the seeded CMA-ES, xNES,
        # UNDX and JANUS studies in their last bits, so a stale pin fails those byte-exact oracles).
        python -m pip install "numpy==2.5.4"
        python -m pip install -e refs/optuna
        # Pin SQLAlchemy to 2.0.45, the release the storage-URL port reproduces (StorageUrlStandardParityTests):
        # its driver registry maps a bare postgresql:// to psycopg2. SQLAlchemy 2.1 maps it to psycopg 3, which
        # is not installed here, so with the unpinned 2.1 every bare PostgreSQL URL failed on the Python side
        # with "No module named 'psycopg'" (dispatch 42258298264, ubuntu interop).
        python -m pip install "sqlalchemy==2.0.45"
        # Backends the parity tests drive LIVE: torch (GPSampler), cmaes (CmaEsSampler), scikit-learn
        # (fANOVA / importance), matplotlib (visualization). Use the CPU-only PyTorch wheels on Linux AND
        # Windows: the runners have no GPU, GPSampler parity is CPU-deterministic, and the default Windows
        # wheel is a multi-GB CUDA build — the CPU wheel is a fraction of the size and installs far faster.
        # macOS wheels are CPU/MPS-only already and are not published on the cpu index, so macOS uses the
        # default index. scikit-learn is PINNED to 1.8.0: the native fANOVA/MDI forests are a byte-for-byte
        # port of that release's RandomForestRegressor, so a newer sklearn (1.9.0) builds slightly different
        # trees and breaks the 1e-12 value parity. redis-py and a Redis server exist on Linux only (see
        # the Linux block below and the "Start Redis" step), so the JournalRedis round-trips self-skip on
        # Windows/macOS.
        if [ "$RUNNER_OS" = "Linux" ] || [ "$RUNNER_OS" = "Windows" ]; then
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
        else
          python -m pip install torch
        fi
        python -m pip install cmaes "scikit-learn==1.8.0" matplotlib
        # plotly: the Plotly render/customization parity tests (PlotlyRenderParityTests,
        # PlotlyCustomizationRenderParityTests) build the SAME figure with live optuna.visualization and
        # compare the JSON. Without it optuna raises "Tried to import 'plotly' but failed" — 78 failures per
        # TFM. Pinned to the version the figure JSON was validated against.
        python -m pip install "plotly==6.6.0"
        # BoTorch parity gate (OptunaSharp.Interop.BoTorch → BoTorchApiParityTests / BoTorchSamplerParityTests):
        # install botorch (pulls gpytorch/linear_operator, reuses the CPU torch above) + the VENDORED
        # optuna_integration (refs/optuna-integration, matching the ported botorch.py) so the bridge is
        # compared against the exact optuna_integration source it ports. Linux-only: byte-parity is the SAME
        # botorch driven on both sides and is CPU-deterministic / OS-independent, so one OS gates it — macOS
        # (10x runner minutes) and Windows self-skip (RequireBoTorchOrInconclusive → Inconclusive). --no-deps
        # keeps the vendored optuna (refs/optuna, v5.0.0) from being replaced by a PyPI optuna.
        if [ "$RUNNER_OS" = "Linux" ]; then
          git submodule update --init refs/optuna-integration
          python -m pip install botorch
          python -m pip install -e refs/optuna-integration --no-deps
        fi
        # The other OS-independent parity backends, Linux-only for the same reason as BoTorch. Each test
        # drives the SAME Python library on both sides, or compares a wire format, so one OS gates it.
        # The Windows/macOS legs keep covering what IS OS-dependent (libm, OpenBLAS kernels). Without
        # these, ~60 cases per TFM reported Inconclusive in CI: green, but never exercised (dispatch run
        # 40360579432).
        #   cma 4.4.4                  PyCmaSampler bridge + VkD-CMA parity. pymoo pins cma==3.2.2, which
        #                              breaks under NumPy 2; pymoo is installed --no-deps below, so this is
        #                              the only cma.
        #   shap 0.52.0                SHAP importance parity (the release the oracle was generated with).
        #   lightgbm                   optuna_integration.lightgbm tuner parity (synthetic trainer).
        #   grpcio + protobuf          gRPC storage-proxy interop, Python server <-> C# client both ways.
        #   psycopg2-binary, PyMySQL   EF Core PostgreSQL/MySQL cross-language suites (Testcontainers starts
        #                              the servers; Docker exists only on the Linux runner). [rsa] pulls in
        #                              cryptography for MySQL 8's caching_sha2_password handshake.
        #   redis                      Python <-> C# JournalRedis round-trips (server: "Start Redis" below).
        #   optunahub (vendored)       OptunaHub bridge + constraint parity: refs/optunahub @ v0.5.0, plus
        #                              refs/optunahub-registry for load_local_module.
        #   JANUS reference            janus_optuna for the JANUS metric/draw parity: the public
        #                              hongyuanyu/JANUS repo at the commit the port was verified against,
        #                              found through JANUS_REF_PATH. Torch-free paths only.
        if [ "$RUNNER_OS" = "Linux" ]; then
          git submodule update --init refs/optunahub refs/optunahub-registry
          python -m pip install "cma==4.4.4" "shap==0.52.0" "lightgbm==4.7.0" "grpcio==1.78.0" "protobuf==6.33.5" \
            "psycopg2-binary==2.9.12" "PyMySQL[rsa]==1.2.0" "redis==8.1.0"
          python -m pip install -e refs/optunahub
          git clone --quiet https://github.com/hongyuanyu/JANUS.git "$RUNNER_TEMP/JANUS"
          git -C "$RUNNER_TEMP/JANUS" checkout --quiet 53e372f776cf92043bd55ab1707b6c812d405a44
          echo "JANUS_REF_PATH=$RUNNER_TEMP/JANUS" >> "$GITHUB_ENV"
        fi
        # find_libpython locates the loadable libpython across framework/venv/manylinux builds — the
        # macOS framework build's INSTSONAME is a framework path that a naive LIBDIR join misses.
        python -m pip install find_libpython
        # pymoo 0.6.1.3 — Mimicry's pin and the exact oracle the native AgeMoea2Optimizer reproduces
        # generation-by-generation (OptunaSharp.Interop.Pymoo → AgeMoea2ParityTests + PymooSamplerParityTests /
        # PymooApiUnitTests). --no-deps keeps pymoo from dragging its own numpy/scipy; its AGE-MOEA-2 survival
        # kernels JIT through numba (llvmlite comes with it), and autograd/alive_progress are import-time deps
        # (scipy/matplotlib are already installed above). The "Re-pin numpy last" below keeps numpy on 2.5.4 so
        # the byte-exact BLAS oracles stay identical; numba 0.68 supports numpy < 2.6. AGE-MOEA-2 parity is
        # host-pinned to x64 (AgeMoea2ParityTests self-skips on the macOS arm64 runner, like CMA-ES/linalg).
        python -m pip install pymoo==0.6.1.3 --no-deps
        python -m pip install autograd alive_progress numba
        # Re-pin numpy last: torch/optuna/numba resolution can drag in a different numpy.
        python -m pip install "numpy==2.5.4"
        python -c "import numpy, optuna; print('optuna', optuna.__version__, '| numpy', numpy.__version__)"
        python -c "import numpy; assert numpy.__version__ == '2.5.4', 'numpy must be 2.5.4 (NumSharp 0.81.0 bundles its OpenBLAS) for byte-exact BLAS parity'"
        python -c "from pymoo.algorithms.moo.age2 import AGEMOEA2; import pymoo, numba; print('pymoo', pymoo.__version__, '| numba', numba.__version__)"

    # Compute the libpython path and export it so pythonnet binds deterministically (PythonSession
    # honors PYTHONNET_PYDLL before its own probe). Works on all three OSes via the runner's python.
    # ML.NET's LightGBM native (lib_lightgbm) needs the OpenMP runtime, which macOS lacks by default;
    # brew provides it so the LightGbm ranking parity tests can load their backend. Where ML.NET ships
    # no osx-arm64 native at all, those tests self-skip (Inconclusive) rather than fail.
    - name: Install libomp for ML.NET LightGBM (macOS)
      if: runner.os == 'macOS'
      run: brew install libomp || true

    - name: Resolve libpython (PYTHONNET_PYDLL)
      shell: bash
      run: |
        PYDLL=$(python - <<'PY'
        import os, sys, sysconfig, glob
        # Primary: find_libpython (maintained, handles every build layout incl. the macOS framework).
        try:
            from find_libpython import find_libpython
            p = find_libpython() or ''
        except Exception:
            p = ''
        # Fallback: an existence-checked candidate list (never a blind LIBDIR+INSTSONAME join, which is
        # what returned a non-existent path on the macOS runner and made pythonnet fail to load).
        if not p or not os.path.isfile(p):
            v = '%d.%d' % sys.version_info[:2]
            libdir = sysconfig.get_config_var('LIBDIR') or ''
            if os.name == 'nt':
                cands = [os.path.join(sys.base_prefix, 'python%d%d.dll' % sys.version_info[:2])]
            else:
                ext = 'dylib' if sys.platform == 'darwin' else 'so'
                cands = [
                    os.path.join(libdir, 'libpython%s.%s' % (v, ext)),
                    os.path.join(libdir, sysconfig.get_config_var('LDLIBRARY') or ''),
                    os.path.join(libdir, sysconfig.get_config_var('INSTSONAME') or ''),
                    os.path.join(sys.base_prefix, 'lib', 'libpython%s.%s' % (v, ext)),
                ] + glob.glob(os.path.join(libdir, 'libpython%s*.%s' % (v, ext)))
            p = next((c for c in cands if c and os.path.isfile(c)), '')
        print(p)
        PY
        )
        if [ -z "$PYDLL" ] || [ ! -f "$PYDLL" ]; then
          echo "::error::could not resolve a loadable libpython (got '$PYDLL')"; exit 1
        fi
        echo "PYTHONNET_PYDLL=$PYDLL" >> "$GITHUB_ENV"
        echo "PYTHONNET_PYDLL resolved to: $PYDLL"

    # Build the project as declared (both TFMs); the Test step runs only the selected TFM(s). See the
    # note on the `test` job's Build step for why TargetFrameworks is not overridden per run.
    - name: Build
      run: dotnet build test/OptunaSharp.Tests.Interop/OptunaSharp.Tests.Interop.csproj --configuration Release -p:NoWarn=${{ env.DOTNET_NOWARN }}

    # A real Redis for the Python <-> C# JournalRedis round-trips: the same compose service the Storage
    # suite uses. Linux only; Windows and macOS runners cannot run Linux containers. The slow leg runs only the
    # BoTorch cases, none of which touch Redis.
    - name: Start Redis (Linux)
      if: runner.os == 'Linux' && matrix.part == 'main'
      run: docker compose -p optunasharp-redis -f test/OptunaSharp.Tests.Storage/docker-compose.yml up -d --wait

    # The live suite grew ~3x since 2026-09-12 (≈600 cases): ~9-15 min per TFM on a desktop, so both TFMs
    # need more than the old 20 min. Slow (the ≥10 s BoTorch qEHVI-family byte-exact cases, ~80 min per TFM
    # because botorch's fused qLogEHVI kernel falls back to pure Python without a C++ toolchain) is excluded
    # here and runs in "Test (slow)" below.
    - name: Test
      if: matrix.part == 'main'
      timeout-minutes: 60
      shell: bash
      run: |
        # Pin OpenBLAS to its Haswell kernels on x64: DYNAMIC_ARCH otherwise picks the kernel per runner CPU
        # (SkylakeX/Zen on AVX-512 hosts), whose last bits differ from the committed linalg oracles (generated
        # on Haswell kernels — AgeMoea2OperatorParityTests' Normalize/Do failed by 1-2 ULP on such a runner)
        # and could differ between NumPy's and NumSharp's OpenBLAS copies. Every x64 runner has AVX2/FMA.
        # Except Windows on AMD CPUs with AVX-512 (Zen 4/5), where OpenBLAS 0.3.34's forced Haswell kernels fault: the script
        # decides per runner and says which it chose, and why.
        source "$GITHUB_WORKSPACE/.github/scripts/openblas_coretype.sh"
        for TFM in ${{ needs.setup.outputs.tfms_space }}; do
          echo "::group::Interop tests ($TFM)"
          dotnet test test/OptunaSharp.Tests.Interop/OptunaSharp.Tests.Interop.csproj \
            --configuration Release --no-build --framework "$TFM" \
            --filter "TestCategory!=Slow" --logger "trx"
          echo "::endgroup::"
        done

    # Slow BoTorch parity: botorch is installed on Linux only (see the install step), so this runs on ubuntu,
    # for v* tags and manual dispatch, and on net10.0 only — both sides of each case drive the same Python
    # botorch, so a second TFM adds ~80 runner-minutes and no unique coverage. It runs on its own "slow" leg,
    # which `setup` adds only when Slow runs, so it no longer lengthens ubuntu's main leg.
    - name: Test (slow)
      if: matrix.part == 'slow'
      timeout-minutes: 240
      shell: bash
      run: |
        # Pin OpenBLAS to its Haswell kernels on x64: DYNAMIC_ARCH otherwise picks the kernel per runner CPU
        # (SkylakeX/Zen on AVX-512 hosts), whose last bits differ from the committed linalg oracles (generated
        # on Haswell kernels — AgeMoea2OperatorParityTests' Normalize/Do failed by 1-2 ULP on such a runner)
        # and could differ between NumPy's and NumSharp's OpenBLAS copies. Every x64 runner has AVX2/FMA.
        # Except Windows on AMD CPUs with AVX-512 (Zen 4/5), where OpenBLAS 0.3.34's forced Haswell kernels fault: the script
        # decides per runner and says which it chose, and why.
        source "$GITHUB_WORKSPACE/.github/scripts/openblas_coretype.sh"
        dotnet test test/OptunaSharp.Tests.Interop/OptunaSharp.Tests.Interop.csproj \
          --configuration Release --no-build --framework net10.0 \
          --filter "TestCategory=Slow" --logger "trx"

    - name: Stop Redis (Linux)
      if: always() && runner.os == 'Linux' && matrix.part == 'main'
      run: docker compose -p optunasharp-redis -f test/OptunaSharp.Tests.Storage/docker-compose.yml down -v || true

    - name: Upload Test Results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        # Artifact names must be unique within a run, and ubuntu has two legs when Slow runs.
        name: interop-test-results-${{ matrix.os }}${{ matrix.part == 'slow' && '-slow' || '' }}
        path: ${{ github.workspace }}/**/TestResults/**/*.trx
        retention-days: 5

  # ---------------------------------------------------------------------------------------------
  # Pack the WHOLE package family and gate it, on EVERY push, PR and tag. This is the release's packing
  # step, run continuously, so a packaging regression goes red on the commit that causes it instead of
  # on release day. It replaces the old `verify-signing` job, which packed a throwaway Core only.
  #
  # Version: on a v* tag, the tag (v1.2.3 -> 1.2.3); otherwise <VersionPrefix>-ci.<run number>, a
  # prerelease version that can never collide with or outrank a real release. Publishes nothing.
  #
  # Gates, in order:
  #   1. Open.snk is the intact published key (size + sha256);
  #   2. verify_strong_name.cs: every OptunaSharp assembly in the feed is really signed with it;
  #   3. verify_packages.cs: one package per packable src/ project, every version stamped (nuspec,
  #      family dependencies, assembly + informational versions), nuget.org metadata present and not
  #      stale, PDBs SourceLinked to this commit with deterministic paths. It also reports whether the
  #      feed is PUBLISHABLE (SourceLink and <repository> name the same repository; false on a mirror).
  # ---------------------------------------------------------------------------------------------
  package:
    name: Pack and verify packages
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      publishable: ${{ steps.gate.outputs.publishable }}
      canonical_repository: ${{ steps.gate.outputs.canonical_repository }}

    steps:
    - uses: actions/checkout@v7

    # Own key prefix: packing restores every satellite's third-party graph.
    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-package-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
        restore-keys: nuget-package-${{ runner.os }}-

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    # The key is committed and marked `binary` in .gitattributes (without which `* text=auto eol=lf`
    # would rewrite CRLF bytes inside it and corrupt the key). Assert both facts before building.
    - name: Key is present and intact
      run: |
        test -f Open.snk || { echo "::error::Open.snk missing from checkout — signing cannot work."; exit 1; }
        SIZE=$(stat -c%s Open.snk)
        SHA=$(sha256sum Open.snk | cut -d' ' -f1)
        echo "Open.snk: $SIZE bytes, sha256 $SHA"
        [ "$SIZE" = "596" ] || { echo "::error::Open.snk is $SIZE bytes, expected 596 — likely line-ending corruption; check the '*.snk binary' rule in .gitattributes."; exit 1; }
        [ "$SHA" = "b897629e0b20090c9219ac80392c037fa4cfcc2bdc21d3c45d9bf74b8df0f671" ] || { echo "::error::Open.snk content changed."; exit 1; }

    - name: Resolve the package version
      id: version
      shell: bash
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          VERSION="${GITHUB_REF#refs/tags/v}"
          # Full SemVer only (1.2.3 or 1.2.3-rc.1). NuGet would normalize a "v1.2" tag to 1.2.0, and the
          # packages would then not carry the version the tag names.
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag v$VERSION is not a SemVer version (expected v<major>.<minor>.<patch>[-<prerelease>])"; exit 1
          fi
        else
          PREFIX=$(sed -nE 's#.*<VersionPrefix[^>]*>([^<]+)</VersionPrefix>.*#\1#p' Directory.Build.props | head -1)
          [ -n "$PREFIX" ] || { echo "::error::no <VersionPrefix> in Directory.Build.props"; exit 1; }
          VERSION="${PREFIX}-ci.${GITHUB_RUN_NUMBER}"
        fi
        echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
        echo "ASSEMBLY_VERSION=${VERSION%%-*}" >> "$GITHUB_OUTPUT"
        echo "Packing version $VERSION (assembly ${VERSION%%-*}) from $(git rev-parse HEAD)"

    - name: Pack every package
      shell: bash
      run: bash .github/scripts/pack_all.sh artifacts/nuget "${{ steps.version.outputs.VERSION }}" "${{ steps.version.outputs.ASSEMBLY_VERSION }}"

    # Every managed assembly in every package must carry OptunaSharp's public key AND a real signature
    # (not delay-signed).
    - name: Verify strong naming of packed assemblies
      run: dotnet run .github/scripts/verify_strong_name.cs -- artifacts/nuget

    - name: Verify the package family (versions, metadata, SourceLink)
      id: gate
      shell: bash
      run: |
        dotnet run .github/scripts/verify_packages.cs -- artifacts/nuget \
          --version "${{ steps.version.outputs.VERSION }}" \
          --commit "$(git rev-parse HEAD)" \
          --source-repository "${{ github.server_url }}/${{ github.repository }}"

    - name: Upload NuGet Packages
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: artifacts/nuget/*.nupkg
        # A release's packages stay downloadable from its run for a quarter; CI packages for 5 days.
        retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 5 }}

  # ---------------------------------------------------------------------------------------------
  # Release pipeline — only on a v* tag on the repository's default branch (`main` on
  # SciSharp/OptunaSharp), and only after every test suite and the package gate passed for the tagged
  # commit.
  # ---------------------------------------------------------------------------------------------
  validate-release:
    needs: [test, satellite-tests, interop-test, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      is_valid: ${{ steps.check.outputs.is_valid }}
      version: ${{ steps.check.outputs.version }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Verify tag is on the default branch
      id: check
      shell: bash
      env:
        # Read from the event rather than written as a literal, so the check follows whichever branch the
        # repository names as default: `main` on SciSharp/OptunaSharp, `master` on the private Nucs mirror.
        # Passed through env, not spliced into the script, so a branch name can never become shell code.
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        TAG_COMMIT=$(git rev-parse HEAD)
        VERSION="${GITHUB_REF#refs/tags/v}"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        # The packages were stamped from the same ref by the `package` job; a mismatch would mean the
        # artifact about to be published is not the tagged one.
        if [ "$VERSION" != "${{ needs.package.outputs.version }}" ]; then
          echo "::error::the package job packed version ${{ needs.package.outputs.version }}, but the tag is v$VERSION"
          echo "is_valid=false" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        # Without a default branch there is nothing to check the tag against, and `origin/` alone would
        # fail merge-base with a less useful message.
        if [ -z "$DEFAULT_BRANCH" ]; then
          echo "::error::the event names no default branch, so the branch of v$VERSION cannot be verified"
          echo "is_valid=false" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        if git merge-base --is-ancestor "$TAG_COMMIT" "origin/$DEFAULT_BRANCH"; then
          echo "Tag v$VERSION is on the default branch ($DEFAULT_BRANCH)"
          echo "is_valid=true" >> "$GITHUB_OUTPUT"
        else
          echo "::error::Tag v$VERSION is NOT on the default branch ($DEFAULT_BRANCH). Releases must be tagged from it."
          echo "is_valid=false" >> "$GITHUB_OUTPUT"
          exit 1
        fi

  create-release:
    needs: [validate-release, package]
    if: needs.validate-release.outputs.is_valid == 'true'
    runs-on: ubuntu-24.04
    # The only job that writes: it creates the GitHub Release and attaches the packages to it.
    permissions:
      contents: write

    steps:
    # Only the release notes are read from the tagged commit, so only docs/releases is checked out.
    - uses: actions/checkout@v7
      with:
        sparse-checkout: docs/releases

    - name: Download NuGet Packages
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
        path: artifacts

    - name: Generate checksums
      shell: bash
      run: |
        cd artifacts
        for f in *.nupkg; do
          sha256sum "$f" | cut -d' ' -f1 > "${f}.sha256"
          echo "${f}: $(cat ${f}.sha256)"
        done

    - name: Check if prerelease
      id: prerelease
      shell: bash
      run: |
        if [[ "${{ needs.validate-release.outputs.version }}" == *"-"* ]]; then
          echo "IS_PRERELEASE=true" >> "$GITHUB_OUTPUT"
        else
          echo "IS_PRERELEASE=false" >> "$GITHUB_OUTPUT"
        fi

    # The release notes are a committed file, docs/releases/RELEASE_<version>.md, written in NumSharp's house style
    # (the same file and the same sections NumSharp's releases use). Its H1, "# OptunaSharp <version> - <title>",
    # names the GitHub Release; everything after it opens the body, and the install lines and the package table close
    # it, the layout of the published 1.0.0 release. Without the file the body is the install header alone, named
    # "OptunaSharp v<version>", and GitHub's generated notes are added. The package table is generated from the
    # packages actually built, so it lists every package the release ships and nothing it does not.
    - name: Compose release notes
      id: notes
      shell: bash
      run: |
        VERSION="${{ needs.validate-release.outputs.version }}"
        NOTES_FILE="docs/releases/RELEASE_${VERSION}.md"
        if [ -f "$NOTES_FILE" ]; then
          NAME=$(head -n 1 "$NOTES_FILE" | sed -n 's/^# \{1,\}//p')
          # A missing H1, or one naming another version (notes copied from the last release and not renamed), would
          # publish the wrong title next to these packages: refuse before anything is created.
          case "$NAME" in
            "OptunaSharp ${VERSION}"|"OptunaSharp ${VERSION} "*) ;;
            *) echo "::error::$NOTES_FILE must start with '# OptunaSharp ${VERSION}' (optionally '- <title>'); its first line is: $(head -n 1 "$NOTES_FILE")"; exit 1 ;;
          esac
          HAS_NOTES=true
        else
          NAME="OptunaSharp v${VERSION}"
          HAS_NOTES=false
        fi
        {
          if [ "$HAS_NOTES" = true ]; then
            tail -n +2 "$NOTES_FILE"
            echo ""
            echo "---"
            echo ""
          else
            echo "## OptunaSharp v${VERSION}"
            echo ""
          fi
          echo "### Install via NuGet"
          echo ""
          echo '```'
          echo "dotnet add package OptunaSharp --version ${VERSION}"
          echo "dotnet tool install --global OptunaSharp.Cli --version ${VERSION}"
          echo '```'
          echo ""
          echo "| Package | NuGet |"
          echo "|---------|-------|"
          for f in artifacts/*.nupkg; do
            ID=$(basename "$f" ".${VERSION}.nupkg")
            echo "| ${ID} | [![NuGet](https://img.shields.io/nuget/v/${ID}.svg)](https://www.nuget.org/packages/${ID}/${VERSION}) |"
          done
        } > RELEASE_BODY.md
        # A heredoc-style output, so a title holding characters a key=value line would misread passes through whole.
        {
          echo "NAME<<RELEASE_NAME_EOF"
          echo "$NAME"
          echo "RELEASE_NAME_EOF"
          echo "HAS_NOTES=$HAS_NOTES"
        } >> "$GITHUB_OUTPUT"
        echo "Release name: $NAME (notes file present: $HAS_NOTES)"
        cat RELEASE_BODY.md

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        name: ${{ steps.notes.outputs.NAME }}
        files: |
          artifacts/*.nupkg
          artifacts/*.sha256
        draft: false
        prerelease: ${{ steps.prerelease.outputs.IS_PRERELEASE }}
        # GitHub's generated notes are only the compare link when nothing merges through pull requests, so they are
        # added only when the release has no notes file of its own.
        generate_release_notes: ${{ steps.notes.outputs.HAS_NOTES != 'true' }}
        body_path: RELEASE_BODY.md

  publish-nuget:
    needs: [validate-release, package]
    if: needs.validate-release.outputs.is_valid == 'true'
    runs-on: ubuntu-24.04
    # The `nuget` environment holds this irreversible push until a required reviewer approves it on the
    # run ("Review deployments"). Configured in Settings -> Environments -> nuget: only `v*` tags may
    # deploy to it, and admins cannot bypass the review. It is also named by the Trusted Publishing
    # policy below, so only a job running in this environment can obtain a publish key.
    environment: nuget

    # Trusted Publishing (OIDC), as NumSharp publishes: no long-lived API key exists anywhere. GitHub mints
    # a short-lived, signed OIDC token for this job (id-token: write). NuGet/login sends it to nuget.org,
    # which checks its repository owner, repository, workflow file and environment claims against the
    # Trusted Publishing policy registered under the SciSharp owner: SciSharp/OptunaSharp, workflow file
    # build-and-release.yml (nuget.org takes the file name only), environment `nuget`, scope "Push new
    # packages and package versions", glob OptunaSharp*. It answers with an API key valid for one hour.
    #
    # A job-level permissions block replaces the workflow's top-level `contents: read` for this job, so
    # everything it needs is listed: id-token:write for the OIDC token, contents:read (harmless, no
    # checkout here), and actions:read so download-artifact can read this run's nuget-packages artifact.
    permissions:
      id-token: write
      contents: read
      actions: read

    steps:
    - name: Download NuGet Packages
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
        path: artifacts

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    # Two refusals before anything is pushed:
    #   - no NUGET_USER: soft-skip with a warning. NuGet/login cannot exchange the token without the
    #     nuget.org user name, and the rest of the release (gates, GitHub Release) still runs and is
    #     asserted, so a v* tag on a repository without the secret (the private mirror) goes green.
    #   - not publishable: hard error. The packages' SourceLink points at the repository this build ran
    #     in, and their <repository> at the canonical one. When they differ (a private mirror), users of
    #     the published packages could not step into the sources, so the push is refused.
    - name: Check the release can be published
      id: gate
      shell: bash
      env:
        NUGET_USER: ${{ secrets.NUGET_USER }}
        PUBLISHABLE: ${{ needs.package.outputs.publishable }}
        CANONICAL: ${{ needs.package.outputs.canonical_repository }}
      run: |
        if [ -z "$NUGET_USER" ]; then
          echo "::warning::NUGET_USER is not configured — skipping the nuget.org publish (soft skip). Set the repo secret to the nuget.org user name that created the Trusted Publishing policy."
          echo "publish=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ "$PUBLISHABLE" != "true" ]; then
          echo "::error::refusing to publish from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}: the packages name ${CANONICAL} as their repository, so their SourceLink would point at sources users cannot reach. Tag the release in ${CANONICAL}."
          exit 1
        fi
        echo "publish=true" >> "$GITHUB_OUTPUT"

    # `user` is the nuget.org USER NAME (profile name, not an email) of the account that created the
    # Trusted Publishing policy, not the SciSharp organization that owns it. The key is requested right
    # before the push so its hour cannot run out, and NuGet/login masks it (core.setSecret) before it
    # becomes an output, so the push below never prints it.
    - name: NuGet login (OIDC trusted publishing)
      if: steps.gate.outputs.publish == 'true'
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    # Core goes first so the satellites' dependency on it resolves as soon as they are indexed. Every
    # package is pushed even when one is refused, and the step fails at the end naming each refusal:
    # stopping at the first would leave every package after it unpublished (NumSharp's 0.80.0-beta1
    # release hit exactly that). A refused NEW id means the policy lacks the scope "Push new packages and
    # package versions" or a glob that matches it.
    - name: Push to NuGet
      if: steps.gate.outputs.publish == 'true'
      shell: bash
      env:
        NUGET_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        VERSION: ${{ needs.validate-release.outputs.version }}
      run: |
        CORE="artifacts/OptunaSharp.${VERSION}.nupkg"
        [ -f "$CORE" ] || { echo "::error::$CORE is missing from the release artifact"; exit 1; }
        failed=""
        for package in "$CORE" $(ls artifacts/*.nupkg | grep -vxF "$CORE"); do
          echo "Pushing $package..."
          # `if !` keeps a refusal from ending the loop: the step's bash runs with -e, which does not
          # exit on a command whose status is tested.
          if ! dotnet nuget push "$package" \
              --api-key "$NUGET_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate; then
            failed="$failed $(basename "$package")"
          fi
        done
        if [ -n "$failed" ]; then
          echo "::error::nuget.org refused:$failed. A new package id needs the Trusted Publishing policy's scope \"Push new packages and package versions\" and a glob that matches it."
          exit 1
        fi
