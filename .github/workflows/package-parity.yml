name: Package Parity (isolated)

# Build -> Package -> Deploy -> Test, each an ISOLATED job. The test job never sees src/: it
# sparse-checks-out only the package-parity project and runs it in a Docker container whose build
# context is that project alone. The container binds to the PACKAGED OptunaSharp (from a local feed)
# and replays real Optuna + real xgboost/lightgbm/sklearn oracles against it. See
# test/OptunaSharp.Tests.PackageParity/README.md.
#
# NumSharp + NumSharp.Interop.OpenBLAS are published to nuget.org, so the packaged OptunaSharp restores
# its ENTIRE dependency graph from nuget.org exactly as a downstream consumer would. Only the freshly
# built OptunaSharp.<version>.nupkg crosses the "deploy" boundary into the test container (local feed);
# every declared dependency comes from nuget.org.

on:
  push:
    branches: [ "master", "main" ]
    paths:
      - "src/**"
      - "test/OptunaSharp.Tests.PackageParity/**"
      - ".github/workflows/package-parity.yml"
  pull_request:
    branches: [ "master", "main" ]
    paths:
      - "src/**"
      - "test/OptunaSharp.Tests.PackageParity/**"
      - ".github/workflows/package-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

# Cancel a superseded in-flight run on the same branch/PR so repeated pushes don't stack full runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOWARN: CS1591%3BCS1573%3BCS1572%3BCS1570%3BCS1574%3BCS1587%3BCS1711%3BCS1734

jobs:
  # 1) BUILD — compile the shipping project (isolated: proves it builds).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          dotnet-quality: 'preview'
      - name: Build Core
        run: dotnet build src/OptunaSharp.Core/OptunaSharp.Core.csproj --configuration Release -p:NoWarn=${{ env.DOTNET_NOWARN }}

  # 2) PACKAGE — pack the .nupkg, run the strong-name gate, and upload it as the ONLY thing that
  #    flows to the test stage.
  package:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          dotnet-quality: 'preview'
      - name: Pack OptunaSharp (its NumSharp deps come from nuget.org)
        id: pack
        run: |
          mkdir -p feed
          # Pack ONLY OptunaSharp into the feed. NumSharp + NumSharp.Interop.OpenBLAS are on nuget.org
          # (the same version Core references), so the test container restores them from there — the feed
          # carries just the freshly built package under test, exactly the artifact a consumer installs.
          # GeneratePackageOnBuild is not set on Core, so a plain `dotnet pack` uses restore -> build -> pack.
          dotnet pack src/OptunaSharp.Core/OptunaSharp.Core.csproj --configuration Release \
            --output feed -p:NoWarn=${{ env.DOTNET_NOWARN }}
          VER=$(ls feed/OptunaSharp.*.nupkg | sed -E 's#.*/OptunaSharp\.(.+)\.nupkg#\1#')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "packed OptunaSharp $VER into feed:"
          ls -1 feed/*.nupkg
      - name: Strong-name gate on the packed assembly
        run: dotnet run .github/scripts/verify_strong_name.cs -- feed
      - uses: actions/upload-artifact@v4
        with:
          name: optunasharp-feed
          path: feed/*.nupkg
          retention-days: 5

  # 3) DEPLOY — stage the packed artifact into an isolated feed the test stage consumes. This is the
  #    "deploy" boundary: only the .nupkg crosses it (swap for GitHub Packages for a hosted feed).
  deploy:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: optunasharp-feed
          path: feed
      - run: |
          echo "Deploying feed:"; ls -la feed
      - uses: actions/upload-artifact@v4
        with:
          name: deployed-feed
          path: feed
          retention-days: 5

  # 4) TEST — ISOLATED, via docker compose (matching the source suites' service pattern). Sparse-
  #    checkout ONLY the package-parity project + the reused Redis compose file (src/ is never
  #    fetched), drop the deployed feed in, then `docker compose up` the test container alongside the
  #    real Redis service. The test container's build context is just this project, so src/ never
  #    enters the image; it reaches services by compose name (redis:6379). Real ML packages are
  #    pip-installed in the container; the packaged OptunaSharp is replayed against their oracles.
  test:
    needs: [ package, deploy ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the isolated test project + reused service compose (no src/)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            test/OptunaSharp.Tests.PackageParity
            test/OptunaSharp.Tests.Storage/docker-compose.yml
          sparse-checkout-cone-mode: false
      - name: Pull the deployed feed into the project
        uses: actions/download-artifact@v4
        with:
          name: deployed-feed
          path: test/OptunaSharp.Tests.PackageParity/feed
      - name: Package-parity via docker compose (test container + real Redis service)
        env:
          OPTUNASHARP_VERSION: ${{ needs.package.outputs.version }}
        run: |
          docker compose -f test/OptunaSharp.Tests.PackageParity/docker-compose.yml \
            up --build --abort-on-container-exit --exit-code-from package-parity
      - name: Tear down
        if: always()
        run: |
          docker compose -f test/OptunaSharp.Tests.PackageParity/docker-compose.yml down -v
