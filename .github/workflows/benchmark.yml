name: Benchmark

on:
  push:
    branches: ["master", "main"]
    paths:
      - 'test/OptunaSharp.Benchmark/**'
      - 'src/**'
      - 'Directory.Build.*'
      - 'global.json'
      - '.github/workflows/benchmark.yml'
  pull_request:
    branches: ["master", "main"]
    paths:
      - 'test/OptunaSharp.Benchmark/**'
      - 'src/**'
      - 'Directory.Build.*'
      - 'global.json'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

# Cancel a superseded in-flight run on the same branch/PR so repeated pushes don't stack full runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compile gate: the BenchmarkDotNet harness must always build. A full perf run is heavy and — until
  # algorithms are ported — not meaningful, so it is manual-only (workflow_dispatch) below.
  build-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build benchmark harness
        run: dotnet build test/OptunaSharp.Benchmark/OptunaSharp.Benchmark.csproj --configuration Release

  # Manual only: run the (placeholder) benchmarks with the short job so the harness is exercised
  # end-to-end without spending CI on meaningless numbers.
  run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Run benchmarks (short)
        run: |
          dotnet run --project test/OptunaSharp.Benchmark/OptunaSharp.Benchmark.csproj \
            -c Release -f net8.0 -- --filter '*' --job short

      - name: Upload BenchmarkDotNet artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-artifacts
          path: BenchmarkDotNet.Artifacts/**
          if-no-files-found: ignore
          retention-days: 5
