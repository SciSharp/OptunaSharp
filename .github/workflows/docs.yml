name: Deploy Docs

on:
  push:
    branches: ["master", "main"]
    paths:
      - 'src/**'
      - 'docs/website-src/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: ["master", "main"]
    paths:
      - 'src/**'
      - 'docs/website-src/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # PRs build the docs (a gate that DocFX metadata compiles), but only master deploys to Pages.
    # Deploy is additionally gated on the `ENABLE_PAGES` repo variable: GitHub Pages requires a paid
    # plan for PRIVATE repos, so on a private mirror the variable stays unset and this job runs
    # build-only (the meaningful gate); set ENABLE_PAGES=true on the public repo to deploy.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so DocFX git-contribute links resolve

      - name: Init NumSharp submodule + stage OpenBLAS natives (src/NumSharp @ journey3)
        shell: bash
        run: |
          git submodule update --init src/NumSharp
          python3 src/NumSharp/src/NumSharp.Interop.OpenBLAS/tools/fetch_openblas.py \
            || python src/NumSharp/src/NumSharp.Interop.OpenBLAS/tools/fetch_openblas.py

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          dotnet-quality: 'preview'

      - name: Install DocFX
        run: dotnet tool install -g docfx

      # DocFX's metadata step compiles OptunaSharp.Core to extract the API surface. On a CI runner
      # (no sibling NumSharp checkout) that restores NumSharp from NuGet via the csproj fallback.
      - name: Build docs
        run: docfx docs/website-src/docfx.json

      - name: Generate AI-friendly docs (llms.txt)
        run: |
          cd docs/website-src
          chmod +x scripts/generate-llms-txt.sh
          ./scripts/generate-llms-txt.sh ../website

      - name: Setup Pages
        if: github.event_name != 'pull_request' && vars.ENABLE_PAGES == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name != 'pull_request' && vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/website'

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request' && vars.ENABLE_PAGES == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
