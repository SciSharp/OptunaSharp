name: Deploy Docs

on:
  push:
    branches: ["master", "main"]
    paths:
      - 'src/**'
      - 'docs/website-src/**'
      - 'Directory.Build.*'
      - 'global.json'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: ["master", "main"]
    paths:
      - 'src/**'
      - 'docs/website-src/**'
      - 'Directory.Build.*'
      - 'global.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Reading is all the build needs; only the `deploy` job asks for the Pages write and OIDC token.
permissions:
  contents: read

# Deploys to Pages are serialized and never cancelled mid-flight, as GitHub recommends. PR builds get
# a group of their own per PR. In the shared "pages" group, a newer PR build would cancel a waiting one
# and leave its PR with a cancelled check.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PRs build the docs as a gate: DocFX metadata must compile the API and the site must render. The
  # Pages artifact is uploaded only when the `deploy` job below will consume it.
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history so DocFX git-contribute links resolve

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Pinned: 2.78.4 is the release the site is verified against (0 warnings, 0 errors). An unpinned
      # global tool install picks up whatever DocFX ships that day, so a template or metadata change
      # upstream could break the gate without any change here.
      - name: Install DocFX
        run: dotnet tool install -g docfx --version 2.78.4

      # DocFX's metadata step compiles OptunaSharp.Core to extract the API surface; it restores
      # NumSharp + NumSharp.Interop.OpenBLAS from NuGet (nuget.org).
      - name: Build docs
        run: docfx docs/website-src/docfx.json

      - name: Generate AI-friendly docs (llms.txt)
        run: |
          cd docs/website-src
          chmod +x scripts/generate-llms-txt.sh
          ./scripts/generate-llms-txt.sh ../website

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs/website'

  # Deploy is gated on the `ENABLE_PAGES` repo variable: GitHub Pages requires a paid plan for PRIVATE
  # repos, so on a private mirror the variable stays unset and only `build` runs (the meaningful gate).
  # Set ENABLE_PAGES=true on the public repo to deploy from master.
  #
  # The `github-pages` environment is attached HERE, not to the build. Pages restricts that environment
  # to the default branch, so a pull-request job that names it is rejected by the protection rules,
  # which would turn every PR's docs check red.
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
