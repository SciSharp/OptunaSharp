name: Examples

on:
  push:
    branches: ["master", "main"]
    paths:
      - 'examples/**'
      - 'src/**'
      - 'Directory.Build.*'
      - 'NuGet.Config'
      - 'global.json'
      - '.github/workflows/examples.yml'
      - '.github/scripts/check_documentation.cs'
  pull_request:
    branches: ["master", "main"]
    paths:
      - 'examples/**'
      - 'src/**'
      - 'Directory.Build.*'
      - 'NuGet.Config'
      - 'global.json'
      - '.github/workflows/examples.yml'
      - '.github/scripts/check_documentation.cs'
  workflow_dispatch:

permissions:
  contents: read

# Cancel a superseded in-flight run on the same branch/PR so repeated pushes don't stack full runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compile gate for examples/: nothing else builds the examples, so an API change in src/ could break one
  # silently. Two kinds are built:
  #   - the .NET 10 file-based apps, each with `dotnet build <file>.cs`, which also builds the projects it
  #     references through `#:project` (Core, the Redis and SQLite storages, the OptunaHub bridge);
  #   - the example projects under examples/projects/ (the ASP.NET Core TuningService, the TuningWorker, the
  #     ML.NET tuner and their shared library), each by its .csproj. Their .cs files are not file-based apps,
  #     so the first loop skips that folder.
  # Building only: several examples need ffmpeg, a Redis server, a running TuningService or a Python with
  # optunahub to run, and the showcases are long-running optimization loops.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Own cache key prefix: sharing build-and-release's key would let this smaller restore claim the
      # entry first and leave the test job's cache without its test-only packages.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-examples-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: nuget-examples-${{ runner.os }}-

      # File-based apps need the .NET 10 SDK; 8.0.x matches the other workflows for the net8.0 leg of the
      # multi-targeted projects the examples reference.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Build every example even after a failure, so one broken example doesn't hide the others; the step
      # fails at the end and names each example that didn't compile.
      - name: Build every example
        shell: bash
        run: |
          set -uo pipefail
          mapfile -t examples < <(
            find examples -type f -name '*.cs' -not -path 'examples/projects/*' | sort
            find examples/projects -type f -name '*.csproj' | sort
          )
          failed=()
          for example in "${examples[@]}"; do
            echo "::group::dotnet build $example"
            if dotnet build "$example" --configuration Release; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=$example::$example does not compile"
              failed+=("$example")
            fi
          done
          echo "Built $(( ${#examples[@]} - ${#failed[@]} )) of ${#examples[@]} examples."
          if (( ${#failed[@]} > 0 )); then
            printf 'Failed to compile: %s\n' "${failed[@]}"
            exit 1
          fi

      # The example projects are meant to be copied into real applications, so they carry the same member
      # documentation the library does; this is the src/ documentation gate, run over them. The file-based
      # apps are scripts with top-level statements and stay out of it.
      - name: Check the example projects' documentation
        run: dotnet run .github/scripts/check_documentation.cs -- examples/projects
