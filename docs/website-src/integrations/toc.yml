# Navigation for every page under integrations/ (DocFX compiles it to integrations/toc.json).
#
# Every group below carries `expanded: true`, so all of them start OPEN on every integrations
# page, instead of only the branch that holds the current page. DocFX's modern template reads the
# key straight from toc.json (its toc.ts: `isExpanded = ... || expanded === true`); no script of
# ours is involved.
# - A group added here without `expanded: true` starts collapsed: give every new group the key.
# - A reader can still collapse a group. templates/optunasharp/public/main.js remembers that choice
#   for 48h and re-collapses the group on later pages, but never on the open page's own branch.
# - The Integrations copy inside docs/toc.yml is a separate tree (the one Docs pages show); these
#   keys do not change it.
- name: Integrations
  href: index.md
- name: Model training
  href: training/index.md
  expanded: true
  items:
    - name: Native scikit-learn-style search
      href: training/scikit-learn.md
    - name: ML.NET
      href: training/ml-net.md
    - name: LightGBM
      href: training/lightgbm.md
    - name: Training-loop pruning
      href: training/pruning.md
